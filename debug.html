<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8f5" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Daily Motion" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Daily Motion — iOS Debug</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#f7f8f5;color:#171917;font:14px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
    body{padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px)}
    main{max-width:720px;margin:auto}
    h1{font-size:26px;letter-spacing:-.04em;margin:0 0 8px}
    p{color:#667067;margin:0 0 18px}
    pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid rgba(19,25,20,.08);border-radius:18px;padding:16px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
    button{width:100%;height:48px;border:0;border-radius:14px;background:#171917;color:#fff;font-weight:800;margin-top:10px}
    .probe{position:absolute;visibility:hidden;pointer-events:none}
    #vh{height:100vh}#svh{height:100svh}#lvh{height:100lvh}#dvh{height:100dvh}
    #safe{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  </style>
</head>
<body>
  <div id="vh" class="probe"></div><div id="svh" class="probe"></div><div id="lvh" class="probe"></div><div id="dvh" class="probe"></div><div id="safe" class="probe"></div>
  <main>
    <h1>iOS Web App Debug</h1>
    <p>Открой эту страницу из каждой установленной иконки и сравни значения.</p>
    <pre id="out">Сбор данных…</pre>
    <button id="copy" type="button">Скопировать данные</button>
  </main>
  <script>
    const px=id=>document.getElementById(id).getBoundingClientRect().height;
    const safe=()=>getComputedStyle(document.getElementById('safe'));
    function snapshot(){
      const vv=window.visualViewport;
      const cs=safe();
      const data={
        timestamp:new Date().toISOString(),
        href:location.href,
        userAgent:navigator.userAgent,
        standaloneMedia:matchMedia('(display-mode: standalone)').matches,
        fullscreenMedia:matchMedia('(display-mode: fullscreen)').matches,
        navigatorStandalone:navigator.standalone===true,
        devicePixelRatio:devicePixelRatio,
        screen:{width:screen.width,height:screen.height,availWidth:screen.availWidth,availHeight:screen.availHeight},
        window:{innerWidth:innerWidth,innerHeight:innerHeight,outerWidth:outerWidth,outerHeight:outerHeight},
        documentElement:{clientWidth:document.documentElement.clientWidth,clientHeight:document.documentElement.clientHeight},
        visualViewport:vv?{width:vv.width,height:vv.height,offsetTop:vv.offsetTop,offsetLeft:vv.offsetLeft,scale:vv.scale}:null,
        viewportUnits:{vh:px('vh'),svh:px('svh'),lvh:px('lvh'),dvh:px('dvh')},
        safeArea:{top:parseFloat(cs.paddingTop)||0,bottom:parseFloat(cs.paddingBottom)||0},
        orientation:{type:screen.orientation?.type||null,angle:screen.orientation?.angle??null}
      };
      const text=JSON.stringify(data,null,2);
      document.getElementById('out').textContent=text;
      window.__debugText=text;
    }
    addEventListener('resize',snapshot);
    visualViewport?.addEventListener('resize',snapshot);
    visualViewport?.addEventListener('scroll',snapshot);
    document.getElementById('copy').addEventListener('click',async()=>{
      try{await navigator.clipboard.writeText(window.__debugText||'');document.getElementById('copy').textContent='Скопировано';setTimeout(()=>document.getElementById('copy').textContent='Скопировать данные',1200)}catch{}
    });
    snapshot();
  </script>
</body>
</html>
