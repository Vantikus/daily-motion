name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install test tooling
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Static checks
        run: npm run check
      - name: Release version guard
        env:
          RELEASE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-release-bump.mjs "$RELEASE_BASE"

  browser-regression:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install test tooling
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser regression tests
        env:
          DEBUG: pw:browser
        run: npm run test:e2e
      - name: Upload browser regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-artifacts
          path: test-results
          if-no-files-found: ignore
